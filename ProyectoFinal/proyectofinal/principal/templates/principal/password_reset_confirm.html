{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña</title>
    <link rel="stylesheet" href="{% static 'css/recuperar.css' %}">
</head>
<body>
    <div class="recuperar-container">
        <div class="formulario">
            <h1>Restablecer Contraseña</h1>
            <p class="descripcion">
                Ingresa tu nueva contraseña a continuación para completar el proceso de recuperación.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="campo">
                    {{ form.as_p }}
                </div>
                <button type="submit">Guardar Contraseña</button>
            </form>
            <div class="volver">
                <a href="{% url 'login' %}">← Volver al login</a>
            </div>
        </div>
    </div>
</body>
</html>
