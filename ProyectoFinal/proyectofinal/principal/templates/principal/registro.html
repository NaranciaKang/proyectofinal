{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="{% static 'css/styleslogin.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="formulario">
        <h1>Registro </h1>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="username">
                <label for="id_username">Nombre de usuario</label>
                <input type="text" id="id_username" name="username" required placeholder="Nombre de usuario">
            </div>
            <div class="username">
                <label for="id_email">Correo</label>
                <input type="email" id="id_email" name="email" required placeholder="Correo">
            </div>
            <div class="username">
                <label for="id_password">Contraseña</label>
                <input type="password" id="id_password" name="password" required placeholder="Contraseña">
            </div>
            <input type="submit" value="Registrar">
            <div class="registrarse">
                Ya tengo <a href="{% url 'login' %}">Inicia sesión</a>
            </div>
        </form>

    </div>
</body>
</html>
