{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contraseña cambiada</title>
    <link rel="stylesheet" href="{% static 'css/password_reset_done.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <!-- Icono de éxito -->
            <div class="success-icon">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z" fill="#FFD700"/>
                </svg>
            </div>
            
            <h2>¡Tu contraseña se ha restablecido correctamente!</h2>
            <p class="success-message">Ahora puedes iniciar sesión con tu nueva contraseña.</p>
            
            <a href="{% url 'login' %}" class="back-link">Ir al login</a>
        </div>
    </div>
</body>
</html>
